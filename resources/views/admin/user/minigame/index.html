<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ Steampunk Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1e1a14;
            font-family: 'Courier New', monospace;
            flex-direction: column;
            background-image: radial-gradient(circle at 20% 30%, #3d3429, #171305);
        }
        .container {
            background: #1f1b16;
            padding: 30px 35px 30px 35px;
            border-radius: 20px;
            box-shadow: 0 0 0 2px #6a5f3a, 0 20px 60px rgba(0,0,0,0.9);
            border: 2px solid #b89a5b;
            text-align: center;
            position: relative;
        }
        /* Rivet dekorasi */
        .container::before {
            content: "⬡ ⬡ ⬡";
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f1b16;
            padding: 0 16px;
            color: #b89a5b;
            font-size: 14px;
            letter-spacing: 6px;
        }
        h1 {
            color: #e2c27a;
            font-size: 28px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 0 10px #b89a5b55;
            margin-bottom: 8px;
            font-family: 'Times New Roman', serif;
        }
        h1 span {
            color: #d4af37;
            font-weight: bold;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            color: #b89a5b;
            font-size: 16px;
            margin-bottom: 14px;
            padding: 0 6px;
            border-bottom: 1px dashed #6a5f3a;
            padding-bottom: 8px;
            letter-spacing: 1px;
        }
        .score-board span {
            color: #f0d58c;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #b89a5b;
            border-radius: 12px;
            background: #1f1b16;
            box-shadow: inset 0 0 40px #0f0d0a, 0 0 30px #b89a5b33;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
        }
        .controls {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 28px;
            border: 2px solid #b89a5b;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: #2a241e;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 0 1px #6a5f3a;
        }
        button:hover {
            background: #b89a5b;
            color: #1f1b16;
            box-shadow: 0 0 30px #b89a5b88;
            transform: scale(1.03);
        }
        .info {
            color: #7a6f50;
            font-size: 13px;
            margin-top: 14px;
            letter-spacing: 1px;
            border-top: 1px dashed #6a5f3a;
            padding-top: 12px;
        }
        .info kbd {
            background: #2a241e;
            border: 1px solid #6a5f3a;
            padding: 2px 12px;
            border-radius: 30px;
            color: #d4af37;
            font-size: 13px;
        }
        .gear-icon {
            display: inline-block;
            font-size: 22px;
            margin: 0 4px;
            color: #b89a5b;
        }
        @media (max-width: 500px) {
            .container { padding: 16px; }
            h1 { font-size: 20px; letter-spacing: 3px; }
            .score-board { font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span class="gear-icon">⚙</span> STEAMPUNK <span>SNAKE</span> <span class="gear-icon">⚙</span></h1>
    <div class="score-board">
        <div>🔩 SCORE: <span id="score">0</span></div>
        <div>🏅 HIGH: <span id="highScore">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button id="restartBtn">⟳ Restart</button>
    </div>
    <div class="info">
        <kbd>⬆</kbd> <kbd>⬇</kbd> <kbd>⬅</kbd> <kbd>➡</kbd>  •  <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const highSpan = document.getElementById('highScore');

        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        let snake, direction, nextDirection, food, score, gameOver, win, gameLoopInterval;
        let highScore = parseInt(localStorage.getItem('steampunkSnakeHigh')) || 0;
        highSpan.textContent = highScore;

        function init() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameOver = false;
            win = false;
            scoreSpan.textContent = score;
            spawnFood();
            clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(update, 140);
        }

        function spawnFood() {
            let pos;
            let ok;
            let attempts = 0;
            do {
                pos = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                ok = !snake.some(seg => seg.x === pos.x && seg.y === pos.y);
                attempts++;
            } while (!ok && attempts < 500);
            food = pos;
        }

        function update() {
            if (gameOver || win) return;

            const opposite = { 'up':'down','down':'up','left':'right','right':'left' };
            if (nextDirection && opposite[nextDirection] !== direction) {
                direction = nextDirection;
            }

            const head = { ...snake[0] };
            switch (direction) {
                case 'right': head.x++; break;
                case 'left': head.x--; break;
                case 'up': head.y--; break;
                case 'down': head.y++; break;
            }

            const ateFood = (head.x === food.x && head.y === food.y);
            const newSnake = [head, ...snake];
            if (!ateFood) newSnake.pop();

            const headCollision = (
                head.x < 0 || head.x >= GRID_SIZE ||
                head.y < 0 || head.y >= GRID_SIZE ||
                newSnake.slice(1).some(seg => seg.x === head.x && seg.y === head.y)
            );

            if (headCollision) {
                gameOver = true;
                clearInterval(gameLoopInterval);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('steampunkSnakeHigh', String(highScore));
                    highSpan.textContent = highScore;
                }
                draw();
                return;
            }

            snake = newSnake;
            if (ateFood) {
                score++;
                scoreSpan.textContent = score;
                if (snake.length === GRID_SIZE * GRID_SIZE) {
                    win = true;
                    clearInterval(gameLoopInterval);
                    draw();
                    return;
                }
                spawnFood();
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid bergaya steampunk (gears)
            ctx.strokeStyle = '#3d3429';
            ctx.lineWidth = 0.8;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Makanan = gear emas
            ctx.shadowColor = '#d4af37';
            ctx.shadowBlur = 18;
            const fx = food.x * CELL_SIZE + CELL_SIZE/2;
            const fy = food.y * CELL_SIZE + CELL_SIZE/2;
            const r = CELL_SIZE/2 - 2;
            // Gear sederhana (lingkaran + gigi)
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(fx, fy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#b89a5b';
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const gx = fx + Math.cos(angle) * (r + 3);
                const gy = fy + Math.sin(angle) * (r + 3);
                ctx.beginPath();
                ctx.arc(gx, gy, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#1f1b16';
            ctx.beginPath();
            ctx.arc(fx, fy, r * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ular = brass & copper
            snake.forEach((seg, i) => {
                const isHead = i === 0;
                const x = seg.x * CELL_SIZE + 1;
                const y = seg.y * CELL_SIZE + 1;
                const size = CELL_SIZE - 2;

                const gradient = ctx.createRadialGradient(
                    x + 4, y + 4, 2,
                    x + size/2, y + size/2, size
                );
                if (isHead) {
                    gradient.addColorStop(0, '#d4af37');
                    gradient.addColorStop(0.6, '#b89a5b');
                    gradient.addColorStop(1, '#8a7a4a');
                } else {
                    gradient.addColorStop(0, '#b89a5b');
                    gradient.addColorStop(0.5, '#8a7a4a');
                    gradient.addColorStop(1, '#5a4f30');
                }
                ctx.fillStyle = gradient;
                ctx.shadowColor = isHead ? '#d4af37' : '#6a5f3a';
                ctx.shadowBlur = isHead ? 18 : 6;
                ctx.beginPath();
                ctx.roundRect(x, y, size, size, 4);
                ctx.fill();

                // Rivet di setiap segmen
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#3d3429';
                ctx.beginPath();
                ctx.arc(x + 4, y + 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + size - 4, y + size - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();

                if (isHead) {
                    ctx.fillStyle = '#1f1b16';
                    let off = getEyeOffsets(direction);
                    ctx.beginPath();
                    ctx.arc(x + 6 + off[0].x, y + 6 + off[0].y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + size - 6 + off[1].x, y + size - 6 + off[1].y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#d4af37';
                    ctx.beginPath();
                    ctx.arc(x + 6 + off[0].x + 0.5, y + 6 + off[0].y + 0.5, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + size - 6 + off[1].x + 0.5, y + size - 6 + off[1].y + 0.5, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.shadowBlur = 0;

            if (gameOver || win) {
                ctx.fillStyle = 'rgba(15,13,10,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = win ? '#d4af37' : '#b53b2a';
                ctx.font = 'bold 34px "Times New Roman", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = win ? '#d4af37' : '#b53b2a';
                ctx.shadowBlur = 25;
                ctx.fillText(win ? '🏆 VICTORY' : '💀 CRUSHED', canvas.width/2, canvas.height/2 - 10);
                ctx.shadowBlur = 0;
                ctx.font = '16px "Courier New", monospace';
                ctx.fillStyle = '#b89a5b';
                ctx.fillText('⚙ press Restart ⚙', canvas.width/2, canvas.height/2 + 50);
            }
        }

        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2*r) r = w/2;
            if (h < 2*r) r = h/2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        function getEyeOffsets(dir) {
            switch (dir) {
                case 'right': return [{x:2,y:-2},{x:-2,y:2}];
                case 'left':  return [{x:-2,y:2},{x:2,y:-2}];
                case 'up':    return [{x:2,y:-2},{x:-2,y:2}];
                case 'down':  return [{x:-2,y:2},{x:2,y:-2}];
                default: return [{x:0,y:0},{x:0,y:0}];
            }
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','A','a','s','S','d','D'].includes(key)) {
                e.preventDefault();
                const map = {
                    'ArrowUp':'up','w':'up','W':'up',
                    'ArrowDown':'down','s':'down','S':'down',
                    'ArrowLeft':'left','a':'left','A':'left',
                    'ArrowRight':'right','d':'right','D':'right'
                };
                const newDir = map[key];
                const opposite = {'up':'down','down':'up','left':'right','right':'left'};
                if (newDir && opposite[newDir] !== direction) {
                    nextDirection = newDir;
                }
            }
        });

        document.getElementById('restartBtn').addEventListener('click', () => { init(); draw(); });

        init();
        draw();

        // Touch swipe
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            e.preventDefault();
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!touchStartX || !touchStartY) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
            let newDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
            const opposite = {'up':'down','down':'up','left':'right','right':'left'};
            if (opposite[newDir] !== direction) nextDirection = newDir;
            touchStartX = t.clientX;
            touchStartY = t.clientY;
        });
        canvas.addEventListener('touchend', () => { touchStartX = 0; touchStartY = 0; });
    })();
</script>

</body>
</html>
